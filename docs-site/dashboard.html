<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wisp Conversations Dashboard</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Wisp home">
        <img src="https://wisp-widget.pages.dev/Pixie.png" alt="" class="brand-mark">
        <span>Wisp</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="/install-shopify">Shopify</a>
        <a href="/install-website">Website</a>
        <a href="/dashboard" aria-current="page">Dashboard</a>
      </nav>
    </header>

    <main class="dashboard-shell">
      <section class="page-heading">
        <p class="eyebrow">Private dashboard</p>
        <h1>Customer conversations by brand.</h1>
        <p>No conversation data is stored in this page. Rows load from Supabase after you enter a dashboard key.</p>
      </section>

      <section class="tool-panel dashboard-controls" aria-label="Dashboard controls">
        <label class="field">
          <span>Site ID</span>
          <input id="site-id" type="text" placeholder="client-domain.com" autocomplete="off">
        </label>
        <button class="button primary" id="load" type="button">Load conversations</button>
        <button class="button secondary" id="change-key" type="button">Change key</button>
        <p class="status-text" id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="sessions" class="sessions" aria-live="polite"></section>
    </main>

    <script>
      (function () {
        var conversationsUrl = "https://supabasedb.datastraw.in/functions/v1/get-conversations";
        var keyStorageName = "wisp_dashboard_key";
        var siteInput = document.getElementById("site-id");
        var loadButton = document.getElementById("load");
        var changeKeyButton = document.getElementById("change-key");
        var status = document.getElementById("status");
        var sessions = document.getElementById("sessions");

        function getDashboardKey(forcePrompt) {
          var stored = sessionStorage.getItem(keyStorageName);
          if (stored && !forcePrompt) {
            return stored;
          }
          var entered = window.prompt("Dashboard key");
          if (!entered) {
            return "";
          }
          sessionStorage.setItem(keyStorageName, entered);
          return entered;
        }

        function normalizeRows(data) {
          if (Array.isArray(data)) {
            return data;
          }
          if (Array.isArray(data.data)) {
            return data.data;
          }
          if (Array.isArray(data.rows)) {
            return data.rows;
          }
          return [];
        }

        function dateValue(row) {
          var value = row.timestamp || row.created_at || "";
          var time = Date.parse(value);
          return Number.isNaN(time) ? 0 : time;
        }

        function formatTimestamp(value) {
          if (!value) {
            return "";
          }
          var date = new Date(value);
          if (Number.isNaN(date.getTime())) {
            return String(value);
          }
          return date.toLocaleString();
        }

        function groupRows(rows) {
          var map = new Map();
          rows.forEach(function (row) {
            var sessionId = row.session_id || "unknown-session";
            if (!map.has(sessionId)) {
              map.set(sessionId, []);
            }
            map.get(sessionId).push(row);
          });

          return Array.from(map.entries()).map(function (entry) {
            var messages = entry[1].slice().sort(function (a, b) {
              return dateValue(a) - dateValue(b);
            });
            var newest = messages.reduce(function (max, row) {
              return Math.max(max, dateValue(row));
            }, 0);
            return {
              sessionId: entry[0],
              newest: newest,
              messages: messages
            };
          }).sort(function (a, b) {
            return b.newest - a.newest;
          });
        }

        function renderSessions(rows) {
          sessions.textContent = "";
          if (!rows.length) {
            var empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = "No conversations found for this site id.";
            sessions.appendChild(empty);
            return;
          }

          groupRows(rows).forEach(function (group) {
            var card = document.createElement("article");
            card.className = "session-card";

            var heading = document.createElement("div");
            heading.className = "session-heading";
            var title = document.createElement("h2");
            title.textContent = group.sessionId;
            var count = document.createElement("span");
            count.textContent = group.messages.length + " message" + (group.messages.length === 1 ? "" : "s");
            heading.appendChild(title);
            heading.appendChild(count);
            card.appendChild(heading);

            group.messages.forEach(function (row) {
              var item = document.createElement("div");
              item.className = "conversation-row";

              var meta = document.createElement("p");
              meta.className = "conversation-time";
              meta.textContent = formatTimestamp(row.timestamp || row.created_at);

              var message = document.createElement("p");
              message.className = "conversation-message";
              message.textContent = row.message || "";

              var reply = document.createElement("p");
              reply.className = "conversation-reply";
              reply.textContent = row.reply || "";

              item.appendChild(meta);
              item.appendChild(message);
              item.appendChild(reply);

              if (row.handoff === true || row.handoff === "true") {
                var handoff = document.createElement("span");
                handoff.className = "badge";
                handoff.textContent = "Handoff";
                item.appendChild(handoff);
              }

              card.appendChild(item);
            });

            sessions.appendChild(card);
          });
        }

        function loadConversations() {
          var key = getDashboardKey(false);
          var siteId = siteInput.value.trim();
          if (!key) {
            status.textContent = "Enter a dashboard key.";
            return;
          }
          if (!siteId) {
            status.textContent = "Enter a site id.";
            return;
          }

          status.textContent = "Loading...";
          sessions.textContent = "";

          fetch(conversationsUrl + "?site_id=" + encodeURIComponent(siteId), {
            method: "GET",
            headers: {
              "X-Dashboard-Key": key
            }
          }).then(function (response) {
            if (response.status === 401) {
              sessionStorage.removeItem(keyStorageName);
              throw new Error("Invalid key");
            }
            if (!response.ok) {
              throw new Error("Could not load conversations");
            }
            return response.json();
          }).then(function (data) {
            status.textContent = "";
            renderSessions(normalizeRows(data));
          }).catch(function (error) {
            sessions.textContent = "";
            status.textContent = error.message === "Invalid key" ? "Invalid key" : "Could not load conversations.";
          });
        }

        loadButton.addEventListener("click", loadConversations);
        siteInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            loadConversations();
          }
        });
        changeKeyButton.addEventListener("click", function () {
          sessionStorage.removeItem(keyStorageName);
          getDashboardKey(true);
        });

        getDashboardKey(false);
      }());
    </script>
  </body>
</html>
